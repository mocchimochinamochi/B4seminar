<!doctype html>
<html>
<head>
<!-- ユーザエージェントを取得し，パソコンからのアクセスに限定する -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const ua = navigator.userAgent.toLowerCase(); //ユーザーエージェント文字列を取得（小文字化）
    const isSmartPhone = //スマートフォンかどうかを判定
        ua.indexOf('iphone') !== -1 ||
        (ua.indexOf('android') !== -1 && ua.indexOf('mobile') !== -1) ||
        ua.indexOf('ipad') !== -1;

    if (isSmartPhone) { //スマートフォンからのアクセスだった場合
        document.body.innerHTML = `
             <style>
                .pc-only-message {
                    text-align: left; /* 左揃え */
                    font-family: sans-serif; /* ゴシック体 */
                    margin-top: 10vh; /* 画面高さの10%下に配置 */
                    padding: 0 5vw; /* 左右に画面幅の5%の余白 */
                }
                .pc-only-message h2 { /* 見出しの文字サイズを画面幅に応じて可変に */
                    font-size: clamp(20px, 5vw, 32px);
                }
                .pc-only-message p { /* 本文の文字サイズを画面幅に応じて可変に */
                    font-size: clamp(14px, 4vw, 18px);
                    line-height: 1.6; /* 行間を広めにして読みやすく */
                }
            </style>
            <!-- 実際に表示するメッセージ -->
            <div class="pc-only-message">
                <h2>本アンケートはPC専用です</h2>
                <p>
                    本アンケートはパソコン専用です．<br>
                    ブラウザは Google Chrome，Firefox，Microsoft Edge のいずれかの最新版をご利用ください．<br><br>
                    スマートフォンやタブレット端末，上記以外のブラウザなどからアクセスした場合，<br>
                    一見正常に見えても，正しく回答が記録されないためポイント付与できません．<br>
                    必ずパソコンのブラウザからアクセスしてください．
                </p>
            </div>
        `;
        // 以降のJavaScript処理（アンケート本体）を強制停止
        throw new Error("Mobile access blocked");
    }
});
</script>
